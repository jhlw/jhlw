<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>专户开放申赎规则配置</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
}
body {
  background-color: #F5F7FA;
  padding: 24px;
}
.container {
  max-width: 1400px;
  margin: 0 auto;
}
.page-title {
  font-size: 20px;
  font-weight: 600;
  color: #1D2129;
  margin-bottom: 20px;
}
.card {
  background: #FFFFFF;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  padding: 24px;
  margin-bottom: 20px;
}
.card-title {
  font-size: 16px;
  font-weight: 500;
  color: #1D2129;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title::before {
  content: '';
  width: 4px;
  height: 16px;
  background-color: #4080FF;
  border-radius: 2px;
}
.form-group {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  margin-bottom: 16px;
  align-items: center;
}
.radio-group {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}
.radio-item {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 14px;
  color: #4E5969;
}
.radio-item input {
  width: 16px;
  height: 16px;
  cursor: pointer;
}
.form-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 190px;
}
.form-item label {
  font-size: 14px;
  color: #4E5969;
  font-weight: 400;
}
.form-item input,
.form-item select {
  height: 40px;
  padding: 0 12px;
  border: 1px solid #CDD0D6;
  border-radius: 6px;
  font-size: 14px;
  color: #1D2129;
  outline: none;
  transition: border-color 0.2s;
}
.form-item input:focus,
.form-item select:focus {
  border-color: #4080FF;
  box-shadow: 0 0 0 2px rgba(64, 128, 255, 0.15);
}
.form-item input:disabled {
  background-color: #F7F8FA;
  color: #86909C;
  cursor: not-allowed;
}
.tip {
  font-size: 12px;
  color: #86909C;
}
.result-box {
  background: #F7F8FA;
  border: 1px solid #E5E6EB;
  border-radius: 8px;
  padding: 20px;
}
.btn-bar {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 12px;
}
.btn {
  height: 40px;
  padding: 0 20px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
}
.btn-primary {
  background-color: #4080FF;
  color: #fff;
}
.btn-primary:hover {
  background-color: #3370FF;
}
.btn-default {
  background-color: #fff;
  color: #4E5969;
  border: 1px solid #CDD0D6;
}
.btn-default:hover {
  background-color: #F7F8FA;
}
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
}
.modal-content {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  background: #fff;
  padding: 24px;
  border-radius: 12px;
  width: 600px;
  max-width: 90%;
}
.modal-title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 16px;
}
.modal-body {
  margin-bottom: 20px;
}
.rule-item {
  margin-bottom: 8px;
  font-size: 14px;
}
</style>
</head>
<body>
<div class="container">
  <h1 class="page-title">专户开放申赎规则配置</h1>

  <div class="card">
    <div class="card-title">Step1：是否使用计算公式</div>
    <div class="radio-group" id="useFormula">
      <label class="radio-item"><input type="radio" name="useFormula" value="1" checked> 是（自动计算）</label>
      <label class="radio-item"><input type="radio" name="useFormula" value="0"> 否（手动录入）</label>
    </div>
  </div>

  <div class="card" id="formulaCard">
    <div class="card-title">Step2：选择开放期计算公式</div>
    <div class="radio-group" style="margin-bottom:20px;">
      <label class="radio-item"><input type="radio" name="formType" value="1" checked>滚动期限，指定周几公式</label>
      <label class="radio-item"><input type="radio" name="formType" value="2">指定月份，指定日期公式</label>
      <label class="radio-item"><input type="radio" name="formType" value="3">滚动期限，指定日期公式</label>
      <label class="radio-item"><input type="radio" name="formType" value="4">滚动期限，不指定公式</label>
      <label class="radio-item"><input type="radio" name="formType" value="5">指定月份，指定周几公式</label>
    </div>
    <div class="form-group">
      <div class="form-item">
        <label>封闭起始基准日</label>
        <select name="baseDateType">
          <option value="product">产品成立日</option>
          <option value="contract">合同生效日</option>
        </select>
      </div>
      <div class="form-item">
        <label>封闭期限类型</label>
        <select name="closePeriodType">
          <option>首次封闭期限</option>
          <option>非首次封闭期限</option>
          <option>定期封闭期限</option>
        </select>
      </div>
      <div class="form-item">
        <label>封闭期限单位</label>
        <select name="periodUnit">
          <option>1个月</option>
          <option>3个月</option>
          <option>6个月</option>
          <option>1年</option>
          <option>2年</option>
          <option>3年</option>
        </select>
      </div>
      <div class="form-item">
        <label>指定周数</label>
        <select name="weekNum">
          <option>第1周</option>
          <option>第2周</option>
          <option>第3周</option>
          <option>第4周</option>
          <option>第5周</option>
        </select>
      </div>
      <div class="form-item">
        <label>每周星期几</label>
        <select name="weekDay">
          <option>周一</option>
          <option>周二</option>
          <option>周三</option>
          <option>周四</option>
          <option>周五</option>
        </select>
      </div>
    </div>
    <div style="margin-top:12px; display:flex; gap:12px;">
      <button class="btn btn-primary" id="calcBtn">立即计算开放日</button>
      <button class="btn btn-default" id="previewBtn">规则预览</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Step3：开放期信息</div>
    <div class="result-box">
      <div class="form-group">
        <div class="form-item">
          <label>基准日期</label>
          <input type="date" name="baseDate" id="baseDate">
        </div>
        <div class="form-item">
          <label>首个开放期起始日</label>
          <input type="date" name="firstOpenDate" id="firstOpenDate" readonly>
          <span class="tip">公式计算结果</span>
        </div>
        <div class="form-item">
          <label>第二个开放期起始日</label>
          <input type="date" name="secondOpenDate" id="secondOpenDate" readonly>
        </div>
      </div>
      <div class="form-group">
        <div class="form-item">
          <label>存续期开放规则</label>
          <input type="text" name="openRule" value="按公式滚动生成" readonly>
        </div>
        <div class="form-item">
          <label>开放期限</label>
          <input type="text" name="openDays" value="5天（非交易日顺延）" readonly>
        </div>
        <div class="form-item">
          <label>开放类型</label>
          <select name="openType">
            <option>开放申赎</option>
            <option>仅开放赎回</option>
            <option>仅开放申购</option>
          </select>
        </div>
        <div class="form-item">
          <label>公告日期</label>
          <input type="date" name="noticeDate">
        </div>
      </div>
    </div>
  </div>

  <div class="btn-bar">
    <button class="btn btn-default" id="resetBtn">重置</button>
    <button class="btn btn-default" id="exportPdfBtn">导出PDF</button>
    <button class="btn btn-primary" id="saveBtn">保存配置</button>
  </div>
</div>

<div class="modal" id="previewModal">
  <div class="modal-content">
    <div class="modal-title">开放申赎规则预览</div>
    <div class="modal-body" id="previewContent"></div>
    <div style="text-align:right;">
      <button class="btn btn-primary" onclick="closePreview()">确定</button>
    </div>
  </div>
</div>

<script>
const holidayList = [
  '2026-01-01','2026-01-02','2026-01-03',
  '2026-01-20','2026-01-21','2026-01-22','2026-01-23','2026-01-24','2026-01-25','2026-01-26','2026-01-27',
  '2026-04-04','2026-04-05','2026-04-06',
  '2026-05-01','2026-05-02','2026-05-03',
  '2026-06-19','2026-06-20','2026-06-21',
  '2026-09-25','2026-09-26','2026-09-27',
  '2026-10-01','2026-10-02','2026-10-03','2026-10-04','2026-10-05','2026-10-06','2026-10-07'
];

const useFormula = document.querySelectorAll('input[name="useFormula"]');
const formulaCard = document.getElementById('formulaCard');
useFormula.forEach(item => {
  item.addEventListener('change', () => {
    formulaCard.style.display = item.value === '1' ? 'block' : 'none';
    document.querySelectorAll('#firstOpenDate, #secondOpenDate').forEach(i => {
      i.readOnly = item.value === '1';
    });
  });
});

document.getElementById('calcBtn').addEventListener('click', () => {
  const baseDate = document.getElementById('baseDate').value;
  if (!baseDate) { alert('请先输入基准日期！'); return; }
  const periodUnit = document.querySelector('[name=periodUnit]').value;
  const weekDay = document.querySelector('[name=weekDay]').value;
  let d = new Date(baseDate);
  let num = parseInt(periodUnit);
  if (periodUnit.includes('月')) d.setMonth(d.getMonth() + num);
  else if (periodUnit.includes('年')) d.setFullYear(d.getFullYear() + num);
  let targetDay = ['周一','周二','周三','周四','周五'].indexOf(weekDay) + 1;
  let firstOpen = getNextTradeDay(d, targetDay);
  let secondOpen = addPeriod(firstOpen, periodUnit);
  secondOpen = getNextTradeDay(secondOpen, targetDay);
  document.getElementById('firstOpenDate').value = formatDate(firstOpen);
  document.getElementById('secondOpenDate').value = formatDate(secondOpen);
});

function formatDate(date) {
  const d = new Date(date);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function addPeriod(date, period) {
  let d = new Date(date);
  let num = parseInt(period);
  if (period.includes('月')) d.setMonth(d.getMonth() + num);
  else if (period.includes('年')) d.setFullYear(d.getFullYear() + num);
  return d;
}

function getNextTradeDay(date, targetWeekday) {
  let d = new Date(date);
  while (true) {
    let day = d.getDay() || 7;
    let dateStr = formatDate(d);
    if (day >=1 && day <=5 && !holidayList.includes(dateStr)) {
      if (day === targetWeekday) break;
      else if (day < targetWeekday) d.setDate(d.getDate() + (targetWeekday - day));
      else d.setDate(d.getDate() + (7 - (day - targetWeekday)));
    } else {
      d.setDate(d.getDate() + 1);
    }
  }
  return d;
}

document.getElementById('previewBtn').addEventListener('click', () => {
  const baseDate = document.getElementById('baseDate').value;
  const firstOpen = document.getElementById('firstOpenDate').value;
  const secondOpen = document.getElementById('secondOpenDate').value;
  const periodUnit = document.querySelector('[name=periodUnit]').value;
  const weekDay = document.querySelector('[name=weekDay]').value;
  const openType = document.querySelector('[name=openType]').value;
  let content = `
    <div class="rule-item"><strong>基准日期：</strong>${baseDate || '未设置'}</div>
    <div class="rule-item"><strong>封闭期限：</strong>${periodUnit}</div>
    <div class="rule-item"><strong>开放日规则：</strong>每周${weekDay}</div>
    <div class="rule-item"><strong>首个开放期：</strong>${firstOpen || '未计算'}</div>
    <div class="rule-item"><strong>第二个开放期：</strong>${secondOpen || '未计算'}</div>
    <div class="rule-item"><strong>开放类型：</strong>${openType}</div>
    <div class="rule-item"><strong>开放期限：</strong>5天（非交易日顺延）</div>
  `;
  document.getElementById('previewContent').innerHTML = content;
  document.getElementById('previewModal').style.display = 'block';
});

function closePreview() {
  document.getElementById('previewModal').style.display = 'none';
}

document.getElementById('exportPdfBtn').addEventListener('click', () => {
  alert('PDF导出已触发，可对接后端生成接口');
});

document.getElementById('saveBtn').addEventListener('click', () => {
  const baseDate = document.getElementById('baseDate').value;
  if (!baseDate) { alert('请输入基准日期！'); return; }
  if (document.querySelector('input[name="useFormula"]:checked').value === '1') {
    if (!document.getElementById('firstOpenDate').value) {
      alert('请先计算开放日！'); return;
    }
  }
  const data = {};
  document.querySelectorAll('[name]').forEach(el => {
    data[el.name] = el.value;
  });
  console.log('提交后端：', data);
  alert('保存成功！已输出到控制台');
});

document.getElementById('resetBtn').addEventListener('click', () => {
  window.location.reload();
});
</script>
</body>
</html>
