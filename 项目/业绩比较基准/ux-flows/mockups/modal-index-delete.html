<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>删除指数确认 — Wireframe</title>
<style>
:root{
 --color-primary:#0F172A;--color-secondary:#1E3A8A;--color-accent:#A16207;
 --color-bg:#F8FAFC;--color-fg:#020617;--color-card:#FFFFFF;
 --color-muted:#E8ECF1;--color-muted-fg:#475569;--color-border:#E2E8F0;
 --color-destructive:#DC2626;--ring:#1E3A8A;
 --shadow-md:0 4px 6px rgba(15,23,42,.08);--shadow-lg:0 10px 25px rgba(15,23,42,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Fira Sans','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;background:#DFE5EC;display:flex;justify-content:center;padding:16px 0;color:var(--color-fg)}
.wf-screen{width:1280px;min-height:760px;background:var(--color-bg);border:1px solid var(--color-border);border-radius:10px;overflow:hidden;display:flex;box-shadow:var(--shadow-md)}
.wf-sidebar{width:216px;background:var(--color-card);border-right:1px solid var(--color-border);padding:12px 10px;display:flex;flex-direction:column}
.wf-brand{font-weight:700;color:var(--color-primary);font-size:13px;padding:6px 8px 12px;border-bottom:1px solid var(--color-border)}
.wf-nav-group{font-size:10px;color:var(--color-muted-fg);margin:12px 8px 4px;letter-spacing:.08em}
.wf-nav-item{display:block;font-size:12px;color:#334155;padding:8px 10px;text-decoration:none;border-radius:0 6px 6px 0;border-left:3px solid transparent;transition:background 200ms ease}
.wf-nav-item:hover{background:var(--color-muted)}
.wf-nav-item.on{background:#EEF3FB;color:var(--color-secondary);font-weight:600;border-left-color:var(--color-secondary)}
.wf-main{flex:1;display:flex;flex-direction:column;position:relative}
.wf-header{background:var(--color-card);border-bottom:1px solid var(--color-border);padding:11px 16px;font-size:15px;font-weight:700;color:var(--color-primary)}
.wf-content{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}
.wf-panel{background:var(--color-card);border:1px solid var(--color-border);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.wf-ghost{background:var(--color-card);border:1px solid var(--color-border);border-radius:8px;flex:1;opacity:.6;display:flex;align-items:center;justify-content:center;color:#94A3B8;font-size:12px}
.wf-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wf-form-row{display:flex;gap:10px;align-items:center}
.wf-label{font-size:12px;color:#334155}
.wf-input{border:1px solid #CBD5E1;background:var(--color-card);padding:7px 10px;font-size:12px;color:#334155;border-radius:6px;transition:border-color 200ms ease}
.wf-input:focus{border-color:var(--color-secondary);outline:none;box-shadow:0 0 0 3px rgba(30,58,138,.15)}
.wf-button{background:var(--color-primary);border:1px solid var(--color-primary);padding:7px 18px;font-size:13px;font-weight:600;color:#fff;border-radius:6px;text-align:center;white-space:nowrap;cursor:pointer;transition:background 200ms ease}
.wf-button:hover{background:#1E293B}
.wf-button-secondary{background:var(--color-card);border:1px solid #CBD5E1;padding:7px 18px;font-size:13px;font-weight:500;color:#334155;border-radius:6px;text-align:center;white-space:nowrap;cursor:pointer;transition:border-color 200ms ease,color 200ms ease}
.wf-button-secondary:hover{border-color:var(--color-secondary);color:var(--color-secondary)}
.wf-button-danger{background:var(--color-destructive);border:1px solid var(--color-destructive);padding:7px 18px;font-size:13px;font-weight:600;color:#fff;border-radius:6px;text-align:center;white-space:nowrap;cursor:pointer;transition:background 200ms ease}
.wf-button-danger:hover{background:#B91C1C}
.wf-table{width:100%;border-collapse:collapse;font-size:12px;background:var(--color-card);font-variant-numeric:tabular-nums}
.wf-table th{background:#EEF2F7;color:var(--color-primary);font-weight:600;padding:8px;text-align:left;border-bottom:2px solid #CBD5E1}
.wf-table td{padding:7px 8px;border-bottom:1px solid var(--color-border);color:#334155}
.wf-table tr:hover td{background:#F1F5F9}
.wf-table td.num,.wf-table th.num{text-align:right;font-family:'Fira Code','Consolas',monospace}
.wf-table .op{color:var(--color-secondary);font-weight:500;cursor:pointer}
.wf-table .op:hover{color:var(--color-primary);text-decoration:underline}
.wf-pager{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--color-muted-fg)}
.wf-pager span{border:1px solid #CBD5E1;background:var(--color-card);color:#334155;padding:2px 9px;border-radius:4px;cursor:pointer}
.wf-pager span:hover{border-color:var(--color-secondary);color:var(--color-secondary)}
.wf-tabs{display:flex;gap:6px}
.wf-tab{padding:6px 16px;border:1px solid #CBD5E1;border-radius:6px;font-size:12px;color:#334155;background:var(--color-card);cursor:pointer;transition:all 200ms ease}
.wf-tab.on{background:var(--color-primary);border-color:var(--color-primary);font-weight:600;color:#fff}
.wf-note{font-size:11px;color:var(--color-muted-fg);background:#F1F5F9;border:1px solid var(--color-border);padding:6px 10px;border-radius:6px}
.wf-warn{font-size:11px;color:#B91C1C;background:#FEF2F2;border:1px solid #FECACA;padding:6px 10px;border-radius:6px}
.wf-steps{font-size:12px;color:#334155;line-height:1.9}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
.badge-ok{background:#ECFDF5;color:#059669}
.badge-pending{background:#FFFBEB;color:#B45309}
.badge-reject{background:#FEF2F2;color:#DC2626}
.wf-modal-mask{position:absolute;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px}
.wf-modal{background:var(--color-card);border:1px solid var(--color-border);border-radius:10px;width:840px;max-width:100%;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.wf-modal-head{padding:11px 16px;background:var(--color-card);border-bottom:1px solid var(--color-border);font-weight:700;color:var(--color-primary);font-size:14px;display:flex;gap:8px;align-items:center}
.wf-modal-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.wf-modal-foot{padding:11px 16px;border-top:1px solid var(--color-border);display:flex;gap:8px;justify-content:flex-end}
.wf-panel-title{font-size:12px;font-weight:700;color:var(--color-primary);border-left:3px solid var(--color-secondary);padding-left:8px}
.wf-kv{display:flex;font-size:12px;color:#334155;border-bottom:1px solid #F1F5F9;padding:6px 0}
.wf-kv b{width:130px;color:var(--color-primary);font-weight:600}
.wf-cards{display:flex;gap:12px}
.wf-card{flex:1;background:var(--color-card);border:1px solid var(--color-border);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;transition:border-color 200ms ease,box-shadow 200ms ease;cursor:pointer}
.wf-card:hover{border-color:var(--color-secondary);box-shadow:var(--shadow-md)}
.wf-card h4{font-size:13px;color:var(--color-primary);font-weight:700}
.wf-card p{font-size:11px;color:var(--color-muted-fg)}
.wf-upload{border:1px dashed #CBD5E1;background:#FBFDFF;padding:26px;text-align:center;font-size:12px;color:#64748B;border-radius:8px;transition:border-color 200ms ease}
.wf-upload:hover{border-color:var(--color-secondary)}
.wf-icon-placeholder{background:#EEF3FB;border:1px solid #CBD5E1;border-radius:6px}
.wf-footer{font-size:10px;color:#94A3B8;text-align:center;padding:8px;border-top:1px solid var(--color-border);background:var(--color-card)}
.wf-divider{border:none;border-top:1px solid var(--color-border)}
a.wf-link{color:inherit;text-decoration:none;display:block;cursor:pointer}
a:hover.wf-link{text-decoration:none}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
</style>
</head>
<body>
<div class="wf-screen">
  <div class="wf-sidebar">
    <div class="wf-brand">业绩比较基准管理系统</div>
    <div class="wf-nav-group">数据与配置</div>
    <a class="wf-link" href="s2i-index-library.html"><span class="wf-nav-item on">指数库维护</span></a>
  </div>
  <div class="wf-main">
    <div class="wf-header">指数库维护</div>
    <div class="wf-content"><div class="wf-ghost">（指数列表 · 弹层之下略）</div></div>
    <div class="wf-modal-mask">
      <div class="wf-modal">
        <div class="wf-modal-head">删除指数</div>
        <div class="wf-modal-body">
          <span>确认删除指数「中证2000（000852.SH）」？删除后不可在新配置中选用。</span>
          <div class="wf-warn">⚠ 该指数已被 3 个产品基准配置引用（000270 v3、007830 v1、020932 v2），删除将导致相关配置成分失效，请先行处理。</div>
        </div>
        <div class="wf-modal-foot">
          <a class="wf-link" href="s2i-index-library.html"><div class="wf-button-secondary">取消</div></a>
          <a class="wf-link" href="s2i-index-library.html"><div class="wf-button-danger">确认删除</div></a>
        </div>
      </div>
    </div>
    <div class="wf-footer">弹层 删除指数确认 — UC-002（父屏 s2i 指数库维护）</div>
  </div>
</div>
</body>
</html>
