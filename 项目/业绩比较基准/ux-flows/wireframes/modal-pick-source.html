<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选择数据源指数 — Wireframe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;background:#e0e0e0;display:flex;justify-content:center;padding:16px 0}
.wf-screen{width:1280px;min-height:760px;background:#f5f5f5;border:2px dashed #ccc;display:flex}
.wf-sidebar{width:210px;background:#e8e8e8;border-right:1px dashed #ccc;padding:10px;display:flex;flex-direction:column}
.wf-brand{font-weight:600;color:#444;font-size:13px;padding:6px 4px 10px;border-bottom:1px dashed #ccc}
.wf-nav-group{font-size:10px;color:#888;margin:10px 4px 2px}
.wf-nav-item{font-size:12px;color:#555;padding:7px 8px;text-decoration:none}
.wf-nav-item.on{font-weight:600;color:#333}
.wf-main{flex:1;display:flex;flex-direction:column;position:relative}
.wf-header{background:#e8e8e8;border-bottom:1px dashed #ccc;padding:10px 16px;font-size:15px;font-weight:600;color:#444}
.wf-content{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px}
.wf-ghost{background:#fff;border:1px dashed #ddd;border-radius:4px;flex:1;opacity:.5;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px}
.wf-modal-mask{position:absolute;inset:0;background:rgba(0,0,0,.22);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px}
.wf-modal{background:#f7f7f7;border:2px dashed #999;border-radius:6px;width:880px;display:flex;flex-direction:column}
.wf-modal-head{padding:10px 14px;background:#e8e8e8;border-bottom:1px dashed #ccc;font-weight:600;color:#444;font-size:14px}
.wf-modal-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.wf-filters{display:flex;gap:8px;align-items:center}
.wf-input{border:1px dashed #ccc;background:#fff;padding:7px 10px;font-size:12px;color:#999;border-radius:4px;min-width:200px}
.wf-button{background:#ccc;border:1px dashed #999;padding:7px 18px;font-size:13px;font-weight:600;color:#444;border-radius:4px;text-align:center;white-space:nowrap}
.wf-button-secondary{background:#fff;border:1px dashed #999;padding:7px 18px;font-size:13px;color:#666;border-radius:4px;text-align:center;white-space:nowrap}
.wf-table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
.wf-table th,.wf-table td{border:1px dashed #ccc;padding:6px 8px;color:#666;text-align:left}
.wf-table th{background:#ececec;color:#444}
.wf-pager{display:flex;gap:6px;align-items:center;font-size:11px;color:#888}
.wf-pager span{border:1px dashed #ccc;background:#fff;padding:2px 8px;border-radius:3px}
.wf-modal-foot{padding:10px 14px;border-top:1px dashed #ccc;display:flex;gap:8px;justify-content:flex-end}
.wf-footer{font-size:10px;color:#aaa;text-align:center;padding:7px;border-top:1px dashed #ddd}
a.wf-link{color:inherit;text-decoration:none;display:block}
a.wf-link:hover{opacity:.6}
</style>
</head>
<body>
<div class="wf-screen">
  <div class="wf-sidebar">
    <div class="wf-brand">业绩比较基准管理系统</div>
    <div class="wf-nav-group">数据与配置</div>
    <a class="wf-link" href="s2i-index-library.html"><span class="wf-nav-item on">指数库维护</span></a>
  </div>
  <div class="wf-main">
    <div class="wf-header">指数库维护</div>
    <div class="wf-content"><div class="wf-ghost">（新增指数弹层之下略 — 本弹层由「选择数据源指数」按钮打开）</div></div>
    <div class="wf-modal-mask">
      <div class="wf-modal">
        <div class="wf-modal-head">选择数据源指数</div>
        <div class="wf-modal-body">
          <div class="wf-filters">
            <input class="wf-input" placeholder="编码/名称检索" readonly>
            <div class="wf-button">筛选</div>
            <div class="wf-button-secondary">重置</div>
          </div>
          <table class="wf-table">
            <tr><th>☐</th><th>指数编码</th><th>指数名称</th><th>类型</th><th>内/外盘</th><th>币种</th></tr>
            <tr><td>◉</td><td>CBA00201.CS</td><td>中债-综合全价</td><td>债券</td><td>内盘</td><td>CNY</td></tr>
            <tr><td>☐</td><td>000300.SH</td><td>沪深300</td><td>股票宽基</td><td>内盘</td><td>CNY</td></tr>
            <tr><td>☐</td><td>SPX.GI</td><td>标普500</td><td>股票宽基</td><td>外盘</td><td>USD</td></tr>
          </table>
          <div class="wf-pager"><span>‹</span><span>1</span><span>2</span><span>›</span><i>候选 412 条 · 10 条/页</i></div>
        </div>
        <div class="wf-modal-foot">
          <a class="wf-link" href="modal-add-index.html"><div class="wf-button-secondary">取消</div></a>
          <a class="wf-link" href="modal-add-index.html"><div class="wf-button">确认选择（外盘自动反显币种）</div></a>
        </div>
      </div>
    </div>
    <div class="wf-footer">弹层 选择数据源指数 — UC-002（父层：新增指数）</div>
  </div>
</div>
</body>
</html>
