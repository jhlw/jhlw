<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>删除基准配置（发起→审核） — Wireframe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;background:#e0e0e0;display:flex;justify-content:center;padding:16px 0}
.wf-screen{width:1280px;min-height:760px;background:#f5f5f5;border:2px dashed #ccc;display:flex}
.wf-sidebar{width:210px;background:#e8e8e8;border-right:1px dashed #ccc;padding:10px;display:flex;flex-direction:column}
.wf-brand{font-weight:600;color:#444;font-size:13px;padding:6px 4px 10px;border-bottom:1px dashed #ccc}
.wf-nav-group{font-size:10px;color:#888;margin:10px 4px 2px}
.wf-nav-item{font-size:12px;color:#555;padding:7px 8px;text-decoration:none}
.wf-nav-item.on{font-weight:600;color:#333}
.wf-main{flex:1;display:flex;flex-direction:column;position:relative}
.wf-header{background:#e8e8e8;border-bottom:1px dashed #ccc;padding:10px 16px;font-size:15px;font-weight:600;color:#444}
.wf-content{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px}
.wf-ghost{background:#fff;border:1px dashed #ddd;border-radius:4px;flex:1;opacity:.5;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px}
.wf-modal-mask{position:absolute;inset:0;background:rgba(0,0,0,.22);display:flex;align-items:flex-start;justify-content:center;padding:48px 12px}
.wf-modal{background:#f7f7f7;border:2px dashed #999;border-radius:6px;width:640px;display:flex;flex-direction:column}
.wf-modal-head{padding:10px 14px;background:#e8e8e8;border-bottom:1px dashed #ccc;font-weight:600;color:#444;font-size:14px;display:flex;gap:8px;align-items:center}
.wf-tabs{display:flex;gap:6px;margin-left:auto}
.wf-tab{padding:5px 14px;border:1px dashed #999;border-radius:4px;font-size:12px;color:#666;background:#fff}
.wf-tab.on{background:#ccc;font-weight:600;color:#333}
.wf-modal-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.wf-kv{display:flex;font-size:12px;color:#666;border-bottom:1px dashed #eee;padding:5px 0}
.wf-kv b{width:100px;color:#555;font-weight:600}
.wf-warn{font-size:11px;color:#a33;background:#fbeaea;border:1px dashed #d99;padding:6px 8px;border-radius:4px}
.wf-panel-title{font-size:12px;font-weight:600;color:#444;border-left:3px solid #999;padding-left:8px}
.wf-modal-foot{padding:10px 14px;border-top:1px dashed #ccc;display:flex;gap:8px;justify-content:flex-end}
.wf-button{background:#ccc;border:1px dashed #999;padding:7px 18px;font-size:13px;font-weight:600;color:#444;border-radius:4px;text-align:center;white-space:nowrap}
.wf-button-danger{background:#e5cfcf;border:1px dashed #a66;padding:7px 18px;font-size:13px;font-weight:600;color:#611;border-radius:4px;text-align:center;white-space:nowrap}
.wf-button-secondary{background:#fff;border:1px dashed #999;padding:7px 18px;font-size:13px;color:#666;border-radius:4px;text-align:center;white-space:nowrap}
.wf-footer{font-size:10px;color:#aaa;text-align:center;padding:7px;border-top:1px dashed #ddd}
a.wf-link{color:inherit;text-decoration:none;display:block}
a.wf-link:hover{opacity:.6}
</style>
</head>
<body>
<div class="wf-screen">
  <div class="wf-sidebar">
    <div class="wf-brand">业绩比较基准管理系统</div>
    <div class="wf-nav-group">数据与配置</div>
    <a class="wf-link" href="s2-config-mgmt.html"><span class="wf-nav-item on">产品基准配置管理</span></a>
  </div>
  <div class="wf-main">
    <div class="wf-header">产品基准配置管理</div>
    <div class="wf-content"><div class="wf-ghost">（配置列表 · 弹层之下略）</div></div>
    <div class="wf-modal-mask">
      <div class="wf-modal">
        <div class="wf-modal-head">删除基准配置
          <div class="wf-tabs">
            <a class="wf-link" href="#initPanel"><div class="wf-tab on">① 发起面板</div></a>
            <a class="wf-link" href="#auditPanel"><div class="wf-tab">② 审核面板</div></a>
          </div>
        </div>
        <div class="wf-modal-body">
          <div id="initPanel" class="wf-panel-title">面板① 发起 — 确认删除对象</div>
          <div class="wf-kv"><b>删除对象</b><span>000270 建信灵活配置混合 · 当前版本 v3</span></div>
          <div class="wf-kv"><b>删除理由</b><span>产品转型，基准整体废止（文本域）</span></div>
          <div class="wf-warn">删除须经审核通过方可生效；通过后该配置关联历史区间随之失效。</div>
          <div style="display:flex;gap:8px;justify-content:flex-end">
            <a class="wf-link" href="#auditPanel"><div class="wf-button-danger">提交发起</div></a>
            <a class="wf-link" href="s2-config-mgmt.html"><div class="wf-button-secondary">取消</div></a>
          </div>
          <hr style="border-top:1px dashed #ccc;margin:4px 0">
          <div id="auditPanel" class="wf-panel-title">面板② 审核</div>
          <div class="wf-kv"><b>删除单</b><span>DEL-20261026-02 · 状态：待审核</span></div>
          <div style="display:flex;gap:8px;justify-content:flex-end">
            <a class="wf-link" href="#initPanel"><div class="wf-button-secondary">退回</div></a>
            <a class="wf-link" href="s2-config-mgmt.html"><div class="wf-button">审核通过（删除生效）</div></a>
          </div>
        </div>
      </div>
    </div>
    <div class="wf-footer">弹层 删除基准配置（双面板） — UC-005（父屏 s2）</div>
  </div>
</div>
</body>
</html>
