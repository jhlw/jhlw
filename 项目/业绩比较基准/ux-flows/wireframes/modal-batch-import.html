<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量导入 — Wireframe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;background:#e0e0e0;display:flex;justify-content:center;padding:16px 0}
.wf-screen{width:1280px;min-height:760px;background:#f5f5f5;border:2px dashed #ccc;display:flex}
.wf-sidebar{width:210px;background:#e8e8e8;border-right:1px dashed #ccc;padding:10px;display:flex;flex-direction:column}
.wf-brand{font-weight:600;color:#444;font-size:13px;padding:6px 4px 10px;border-bottom:1px dashed #ccc}
.wf-nav-group{font-size:10px;color:#888;margin:10px 4px 2px}
.wf-nav-item{font-size:12px;color:#555;padding:7px 8px;text-decoration:none}
.wf-nav-item.on{font-weight:600;color:#333}
.wf-main{flex:1;display:flex;flex-direction:column;position:relative}
.wf-header{background:#e8e8e8;border-bottom:1px dashed #ccc;padding:10px 16px;font-size:15px;font-weight:600;color:#444}
.wf-content{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px}
.wf-ghost{background:#fff;border:1px dashed #ddd;border-radius:4px;flex:1;opacity:.5;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px}
.wf-modal-mask{position:absolute;inset:0;background:rgba(0,0,0,.22);display:flex;align-items:flex-start;justify-content:center;padding:64px 12px}
.wf-modal{background:#f7f7f7;border:2px dashed #999;border-radius:6px;width:520px;display:flex;flex-direction:column}
.wf-modal-head{padding:10px 14px;background:#e8e8e8;border-bottom:1px dashed #ccc;font-weight:600;color:#444;font-size:14px}
.wf-modal-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.wf-upload{border:2px dashed #ccc;background:#fff;padding:26px;text-align:center;font-size:12px;color:#999;border-radius:4px}
.wf-steps{font-size:12px;color:#666;line-height:1.9}
.wf-note{font-size:11px;color:#777;background:#fafafa;border:1px dashed #ddd;padding:6px 8px;border-radius:4px}
.wf-modal-foot{padding:10px 14px;border-top:1px dashed #ccc;display:flex;gap:8px;justify-content:flex-end}
.wf-button{background:#ccc;border:1px dashed #999;padding:7px 18px;font-size:13px;font-weight:600;color:#444;border-radius:4px;text-align:center;white-space:nowrap}
.wf-button-secondary{background:#fff;border:1px dashed #999;padding:7px 18px;font-size:13px;color:#666;border-radius:4px;text-align:center;white-space:nowrap}
.wf-footer{font-size:10px;color:#aaa;text-align:center;padding:7px;border-top:1px dashed #ddd}
a.wf-link{color:inherit;text-decoration:none;display:block}
a.wf-link:hover{opacity:.6}
</style>
</head>
<body>
<div class="wf-screen">
  <div class="wf-sidebar">
    <div class="wf-brand">业绩比较基准管理系统</div>
    <div class="wf-nav-group">基准行情库</div>
    <a class="wf-link" href="s3m-quote-maint.html"><span class="wf-nav-item on">基准行情维护</span></a>
  </div>
  <div class="wf-main">
    <div class="wf-header">基准行情维护</div>
    <div class="wf-content"><div class="wf-ghost">（维护弹层之下略 — 本弹层由各维护弹层/s3m 的「批量导入」打开）</div></div>
    <div class="wf-modal-mask">
      <div class="wf-modal">
        <div class="wf-modal-head">批量导入</div>
        <div class="wf-modal-body">
          <div class="wf-steps">① 下载模板 → ② 填写并上传 → ③ 执行导入（并入当前维护弹层的待提交行）</div>
          <div style="display:flex;gap:8px"><a class="wf-link" href="modal-batch-import.html"><div class="wf-button-secondary">下载模板（按类型：点位/利率/汇率）</div></a></div>
          <div class="wf-upload">⬆ 拖拽或点击选择文件（.xlsx / .csv）</div>
          <div class="wf-note">解析校验失败将返回错误行报告（行号+列名+原因），修正模板后重传；校验通过后行数并入发起面板表格。</div>
        </div>
        <div class="wf-modal-foot">
          <a class="wf-link" href="s3m-quote-maint.html"><div class="wf-button-secondary">取消</div></a>
          <a class="wf-link" href="modal-maint-close.html"><div class="wf-button">执行导入</div></a>
        </div>
      </div>
    </div>
    <div class="wf-footer">弹层 批量导入 — UC-007（父屏 s3m / 各维护弹层）</div>
  </div>
</div>
</body>
</html>
