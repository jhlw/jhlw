<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 810">
  <style>
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    :root {
    --bg: #f8fafc;
    --bg-grid: #e2e8f0;
    --mask: #f8fafc;
    --text: #0f172a;
    --text-muted: #475569;
    --arrow: #64748b;
    --color-primary-fill: rgba(6,182,212,0.12);
    --color-primary-stroke: #0891b2;
    --color-secondary-fill: rgba(5,150,105,0.12);
    --color-secondary-stroke: #059669;
    --color-tertiary-fill: rgba(124,58,237,0.12);
    --color-tertiary-stroke: #7c3aed;
    --color-accent-fill: rgba(217,119,6,0.12);
    --color-accent-stroke: #d97706;
    --color-alert-fill: rgba(225,29,72,0.12);
    --color-alert-stroke: #e11d48;
    --color-connector-fill: rgba(234,88,12,0.12);
    --color-connector-stroke: #ea580c;
    --color-neutral-fill: rgba(100,116,139,0.12);
    --color-neutral-stroke: #64748b;
    --color-highlight-fill: rgba(59,130,246,0.12);
    --color-highlight-stroke: #3b82f6;
}
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--bg-grid)" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)"/>
    </marker>
    <marker id="arrow-secondary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-secondary-stroke)"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="var(--bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- title -->
  <text x="40" y="52" fill="var(--text)" font-size="16" font-weight="700">业绩比较基准取数逻辑总览</text>
  <text x="40" y="76" fill="var(--text-muted)" font-size="9">三条独立日历 × 最近披露日原则 ｜ 计算日历＝沪深北交易日（含季末年末） ｜ 六项全局定夺 2026-11-04</text>

  <!-- A股节假日带（贯穿三泳道） -->
  <rect x="530" y="105" width="80" height="375" fill="var(--color-neutral-fill)" rx="4"/>
  <text x="570" y="98" fill="var(--text-muted)" font-size="8" text-anchor="middle">A股节假日</text>

  <!-- 时间参考竖线 -->
  <g stroke="var(--arrow)" stroke-width="0.7" stroke-dasharray="2,5" opacity="0.45">
    <line x1="250" y1="110" x2="250" y2="480"/>
    <line x1="360" y1="110" x2="360" y2="480"/>
    <line x1="470" y1="110" x2="470" y2="480"/>
    <line x1="700" y1="110" x2="700" y2="480"/>
    <line x1="860" y1="110" x2="860" y2="480"/>
    <line x1="960" y1="110" x2="960" y2="480"/>
  </g>
  <!-- 底部时间标签 -->
  <g font-size="8" fill="var(--text-muted)" text-anchor="middle">
    <text x="250" y="494">t−3</text>
    <text x="360" y="494">t−2</text>
    <text x="470" y="494">t−1</text>
    <text x="700" y="494" fill="var(--color-highlight-stroke)" font-weight="700">计算日 t</text>
    <text x="860" y="494" fill="var(--color-secondary-stroke)">美股 t 收盘</text>
    <text x="960" y="494" fill="var(--color-accent-stroke)">T+1 出具</text>
  </g>

  <!-- ===== 泳道 1：A股交易日（计算日历） ===== -->
  <g>
    <rect x="40" y="128" width="140" height="62" rx="6" fill="var(--mask)"/>
    <rect x="40" y="128" width="140" height="62" rx="6" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.5"/>
    <text x="110" y="153" fill="var(--text)" font-size="11" font-weight="600" text-anchor="middle">A股交易日</text>
    <text x="110" y="172" fill="var(--text-muted)" font-size="8" text-anchor="middle">计算日历</text>

    <line x1="200" y1="160" x2="490" y2="160" stroke="var(--color-primary-stroke)" stroke-width="1.5"/>
    <line x1="482" y1="160" x2="688" y2="160" stroke="var(--color-neutral-stroke)" stroke-width="1.2" stroke-dasharray="4,4"/>
    <line x1="700" y1="160" x2="990" y2="160" stroke="var(--color-primary-stroke)" stroke-width="1.5"/>
    <circle cx="250" cy="160" r="5" fill="var(--color-primary-stroke)"/>
    <circle cx="360" cy="160" r="5" fill="var(--color-primary-stroke)"/>
    <circle cx="470" cy="160" r="5" fill="var(--color-primary-stroke)"/>
    <circle cx="700" cy="160" r="9" fill="none" stroke="var(--color-highlight-stroke)" stroke-width="1.5"/>
    <circle cx="700" cy="160" r="6" fill="var(--color-highlight-stroke)"/>
    <text x="570" y="150" fill="var(--text-muted)" font-size="8" text-anchor="middle">A股休市（无计算日）</text>
    <text x="205" y="188" fill="var(--text-muted)" font-size="8">基准仅在 A股交易日逐日计算；季末/年末非交易日另出具披露值（S4，取最近披露日）</text>
  </g>

  <!-- ===== 泳道 2：境外指数（美股示例） ===== -->
  <g>
    <rect x="40" y="253" width="140" height="62" rx="6" fill="var(--mask)"/>
    <rect x="40" y="253" width="140" height="62" rx="6" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.5"/>
    <text x="110" y="278" fill="var(--text)" font-size="11" font-weight="600" text-anchor="middle">境外指数（美股）</text>
    <text x="110" y="297" fill="var(--text-muted)" font-size="8" text-anchor="middle">境外市场交易日</text>

    <line x1="200" y1="285" x2="990" y2="285" stroke="var(--color-secondary-stroke)" stroke-width="1.5"/>
    <circle cx="250" cy="285" r="5" fill="var(--color-secondary-stroke)"/>
    <circle cx="360" cy="285" r="5" fill="var(--color-secondary-stroke)"/>
    <circle cx="470" cy="285" r="5" fill="var(--color-secondary-stroke)"/>
    <circle cx="560" cy="285" r="5" fill="var(--color-secondary-stroke)"/>
    <text x="560" y="272" fill="var(--text-muted)" font-size="7" text-anchor="middle">照常披露</text>
    <circle cx="700" cy="285" r="7" fill="var(--color-secondary-stroke)"/>
    <text x="718" y="278" fill="var(--color-secondary-stroke)" font-size="8" font-weight="600">美股 t 日收盘</text>
    <circle cx="860" cy="285" r="4" fill="none" stroke="var(--color-secondary-stroke)" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="855" y1="297" x2="712" y2="297" stroke="var(--color-secondary-stroke)" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow-secondary)"/>
    <text x="790" y="310" fill="var(--text-muted)" font-size="7.5" text-anchor="middle">T+1 凌晨可得 · T+1 出具时取用（S6）</text>
    <text x="205" y="325" fill="var(--text-muted)" font-size="8">与 A股日历相互独立：A股休市期间境外照常披露；境外休市时沿用最近披露日（S2）</text>
  </g>

  <!-- ===== 泳道 3：人民币中间价 ===== -->
  <g>
    <rect x="40" y="378" width="140" height="62" rx="6" fill="var(--mask)"/>
    <rect x="40" y="378" width="140" height="62" rx="6" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="1.5"/>
    <text x="110" y="403" fill="var(--text)" font-size="11" font-weight="600" text-anchor="middle">人民币中间价</text>
    <text x="110" y="422" fill="var(--text-muted)" font-size="8" text-anchor="middle">中国工作日 9:15</text>

    <line x1="200" y1="410" x2="490" y2="410" stroke="var(--color-accent-stroke)" stroke-width="1.5"/>
    <line x1="482" y1="410" x2="688" y2="410" stroke="var(--color-neutral-stroke)" stroke-width="1.2" stroke-dasharray="4,4"/>
    <line x1="700" y1="410" x2="990" y2="410" stroke="var(--color-accent-stroke)" stroke-width="1.5"/>
    <circle cx="250" cy="410" r="5" fill="var(--color-accent-stroke)"/>
    <circle cx="360" cy="410" r="5" fill="var(--color-accent-stroke)"/>
    <circle cx="470" cy="410" r="5" fill="var(--color-accent-stroke)"/>
    <circle cx="700" cy="410" r="6" fill="var(--color-accent-stroke)"/>
    <text x="718" y="414" fill="var(--color-accent-stroke)" font-size="8" font-weight="600">H(t)</text>
    <text x="570" y="400" fill="var(--text-muted)" font-size="8" text-anchor="middle">停发</text>
    <text x="205" y="438" fill="var(--text-muted)" font-size="8">估值汇率＝人民银行中间价（定夺④）；节假日停发，节后首日恢复，假期变动并入（S3）</text>
  </g>

  <!-- ===== 计算日 t 的四类要素取数 ===== -->
  <text x="40" y="530" fill="var(--text)" font-size="11" font-weight="600">计算日 t 的四类要素取数（各自独立，互不替代）</text>

  <g>
    <rect x="40" y="545" width="272" height="92" rx="6" fill="var(--mask)"/>
    <rect x="40" y="545" width="272" height="92" rx="6" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.5"/>
    <text x="56" y="566" fill="var(--text)" font-size="10" font-weight="600">本币指数</text>
    <text x="56" y="584" fill="var(--text)" font-size="8.5">t 日收盘点位 → 点位自算（8 位，定夺②）</text>
    <text x="56" y="600" fill="var(--text-muted)" font-size="8">中证 / 中债 / 上金所合约（收盘价，定夺⑤）</text>
    <text x="56" y="616" fill="var(--text-muted)" font-size="8">中债晚发布 → 沿用前收，该要素当日收益 0</text>
  </g>
  <g>
    <rect x="332" y="545" width="272" height="92" rx="6" fill="var(--mask)"/>
    <rect x="332" y="545" width="272" height="92" rx="6" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.5"/>
    <text x="348" y="566" fill="var(--text)" font-size="10" font-weight="600">非本币指数</text>
    <text x="348" y="584" fill="var(--text)" font-size="8.5">t 日境外收盘 × t 日中间价折算</text>
    <text x="348" y="600" fill="var(--text-muted)" font-size="8">美股 t 日收盘经 T+1 出具取得（定夺⑥）</text>
    <text x="348" y="616" fill="var(--text-muted)" font-size="8">境外休市 → 沿用最近披露日 t*（S2）</text>
  </g>
  <g>
    <rect x="624" y="545" width="272" height="92" rx="6" fill="var(--mask)"/>
    <rect x="624" y="545" width="272" height="92" rx="6" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="1.5"/>
    <text x="640" y="566" fill="var(--text)" font-size="10" font-weight="600">汇率</text>
    <text x="640" y="584" fill="var(--text)" font-size="8.5">t 日人民银行中间价（定夺④）</text>
    <text x="640" y="600" fill="var(--text-muted)" font-size="8">季末非交易日 → 与指数披露日 d* 对齐（定夺③）</text>
    <text x="640" y="616" fill="var(--text-muted)" font-size="8">人民币计价境外指数免折算（专项 A）</text>
  </g>
  <g>
    <rect x="916" y="545" width="272" height="92" rx="6" fill="var(--mask)"/>
    <rect x="916" y="545" width="272" height="92" rx="6" fill="var(--color-connector-fill)" stroke="var(--color-connector-stroke)" stroke-width="1.5"/>
    <text x="932" y="566" fill="var(--text)" font-size="10" font-weight="600">固定利率</text>
    <text x="932" y="584" fill="var(--text)" font-size="8.5">自然日逐日计息，无交易日历</text>
    <text x="932" y="600" fill="var(--text-muted)" font-size="8">天数：2026-07-01 前 /360，起按当年实际天数（定夺①）</text>
    <text x="932" y="616" fill="var(--text-muted)" font-size="8">节后首个交易日并入假期利息</text>
  </g>

  <!-- ===== 六项全局定夺 ===== -->
  <text x="40" y="680" fill="var(--text)" font-size="11" font-weight="600">六项全局定夺（2026-11-04，口径闭环）</text>
  <g font-size="8">
    <rect x="40" y="692" width="376" height="42" rx="10" fill="var(--mask)"/>
    <rect x="40" y="692" width="376" height="42" rx="10" fill="var(--color-highlight-fill)" stroke="var(--color-highlight-stroke)" stroke-width="1"/>
    <text x="56" y="709" fill="var(--text)" font-weight="600">① 利率天数基准</text>
    <text x="56" y="724" fill="var(--text-muted)">2026-07-01 前 /360，起按当年实际天数（365/366）</text>

    <rect x="432" y="692" width="376" height="42" rx="10" fill="var(--mask)"/>
    <rect x="432" y="692" width="376" height="42" rx="10" fill="var(--color-highlight-fill)" stroke="var(--color-highlight-stroke)" stroke-width="1"/>
    <text x="448" y="709" fill="var(--text)" font-weight="600">② 指数日收益率来源</text>
    <text x="448" y="724" fill="var(--text-muted)">公布点位自算（8 位）；公布涨跌幅仅作入库对账</text>

    <rect x="824" y="692" width="364" height="42" rx="10" fill="var(--mask)"/>
    <rect x="824" y="692" width="364" height="42" rx="10" fill="var(--color-highlight-fill)" stroke="var(--color-highlight-stroke)" stroke-width="1"/>
    <text x="840" y="709" fill="var(--text)" font-weight="600">③ 季末非交易日汇率</text>
    <text x="840" y="724" fill="var(--text-muted)">与指数披露日 d* 对齐（同一时点中间价）</text>

    <rect x="40" y="744" width="376" height="42" rx="10" fill="var(--mask)"/>
    <rect x="40" y="744" width="376" height="42" rx="10" fill="var(--color-highlight-fill)" stroke="var(--color-highlight-stroke)" stroke-width="1"/>
    <text x="56" y="761" fill="var(--text)" font-weight="600">④ 估值汇率口径</text>
    <text x="56" y="776" fill="var(--text-muted)">人民银行中间价；合同另有明确约定者登记执行</text>

    <rect x="432" y="744" width="376" height="42" rx="10" fill="var(--mask)"/>
    <rect x="432" y="744" width="376" height="42" rx="10" fill="var(--color-highlight-fill)" stroke="var(--color-highlight-stroke)" stroke-width="1"/>
    <text x="448" y="761" fill="var(--text)" font-weight="600">⑤ 合约价格类型</text>
    <text x="448" y="776" fill="var(--text-muted)">默认交易所收盘价；结算价/加权均价按合同登记</text>

    <rect x="824" y="744" width="364" height="42" rx="10" fill="var(--mask)"/>
    <rect x="824" y="744" width="364" height="42" rx="10" fill="var(--color-highlight-fill)" stroke="var(--color-highlight-stroke)" stroke-width="1"/>
    <text x="840" y="761" fill="var(--text)" font-weight="600">⑥ 美股基准时点</text>
    <text x="840" y="776" fill="var(--text-muted)">T+1 出具，取美股 T 日收盘（与 QDII 净值一致）</text>
  </g>
</svg>
