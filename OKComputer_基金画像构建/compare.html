<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金对比 - 基金产品画像系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1a365d;
            --secondary-gray: #2d3748;
            --accent-gold: #d69e2e;
            --success-green: #38a169;
            --warning-orange: #dd6b20;
            --danger-red: #e53e3e;
            --info-blue: #3182ce;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a202c 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }
        
        .nav-link {
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav-link:hover {
            color: var(--accent-gold);
        }
        
        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-gold);
        }
        
        .positive {
            color: var(--success-green);
        }
        
        .negative {
            color: var(--danger-red);
        }
        
        .compare-fund-card {
            transition: all 0.3s ease;
            position: relative;
        }
        
        .compare-fund-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .remove-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            background: var(--danger-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .remove-btn:hover {
            background: #c53030;
            transform: scale(1.1);
        }
        
        .add-fund-card {
            border: 2px dashed #4a5568;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .add-fund-card:hover {
            border-color: var(--accent-gold);
            background: rgba(214, 158, 46, 0.05);
        }
        
        .chart-container {
            height: 400px;
            width: 100%;
        }
        
        .comparison-table {
            overflow-x: auto;
        }
        
        .comparison-table table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .comparison-table th,
        .comparison-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .comparison-table th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: 600;
            color: #e2e8f0;
        }
        
        .comparison-table td {
            color: #a0aec0;
        }
        
        .scroll-reveal {
            opacity: 0;
            transform: translateY(20px);
        }
        
        .scroll-reveal.revealed {
            opacity: 1;
            transform: translateY(0);
            transition: all 0.6s ease;
        }
        
        .fund-search-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .fund-search-modal.show {
            display: flex;
        }
        
        .modal-content {
            background: rgba(26, 54, 93, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .fund-option {
            padding: 12px 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        
        .fund-option:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-gray-900/90 backdrop-blur-md border-b border-gray-700/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-8">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 bg-gradient-to-br from-yellow-400 to-yellow-600 rounded-lg flex items-center justify-center">
                            <span class="text-gray-900 font-bold text-sm">基</span>
                        </div>
                        <span class="text-xl font-bold text-white" style="font-family: 'Noto Serif SC', serif;">基金画像系统</span>
                    </div>
                </div>
                
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="nav-link text-gray-300 hover:text-yellow-400 px-3 py-2 text-sm font-medium">首页</a>
                    <a href="analysis.html" class="nav-link text-gray-300 hover:text-yellow-400 px-3 py-2 text-sm font-medium">基金分析</a>
                    <a href="compare.html" class="nav-link active text-white hover:text-yellow-400 px-3 py-2 text-sm font-medium">基金对比</a>
                    <a href="risk.html" class="nav-link text-gray-300 hover:text-yellow-400 px-3 py-2 text-sm font-medium">风险评估</a>
                </div>
                
                <div class="flex items-center space-x-4">
                    <button onclick="clearAllComparisons()" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors">
                        清空对比
                    </button>
                    <button onclick="exportComparison()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors">
                        导出报告
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 页面标题 -->
    <section class="pt-20 pb-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center">
                <h1 class="text-3xl font-bold text-white mb-4" style="font-family: 'Noto Serif SC', serif;">
                    基金产品对比分析
                </h1>
                <p class="text-gray-300 max-w-2xl mx-auto">
                    选择多只基金进行全面对比，从收益表现、风险指标、持仓结构等多个维度深入分析，助您做出更明智的投资决策
                </p>
            </div>
        </div>
    </section>

    <!-- 对比基金选择区域 -->
    <section class="pb-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="comparison-cards">
                <!-- 对比基金卡片将通过JavaScript动态生成 -->
            </div>
        </div>
    </section>

    <!-- 综合对比雷达图 -->
    <section class="py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="glass-card p-6 scroll-reveal">
                <h3 class="text-lg font-semibold text-white mb-6">综合表现对比</h3>
                <div id="radar-chart" class="chart-container"></div>
            </div>
        </div>
    </section>

    <!-- 详细对比表格 -->
    <section class="py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="glass-card p-6 scroll-reveal">
                <h3 class="text-lg font-semibold text-white mb-6">详细指标对比</h3>
                <div class="comparison-table">
                    <table id="comparison-table">
                        <thead>
                            <tr>
                                <th class="w-48">对比项目</th>
                                <!-- 基金列将通过JavaScript动态生成 -->
                            </tr>
                        </thead>
                        <tbody id="comparison-table-body">
                            <!-- 对比数据将通过JavaScript动态生成 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <!-- 风险收益散点图 -->
    <section class="py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="glass-card p-6 scroll-reveal">
                <h3 class="text-lg font-semibold text-white mb-6">风险收益分布</h3>
                <div id="risk-return-chart" class="chart-container"></div>
            </div>
        </div>
    </section>

    <!-- 持仓结构对比 -->
    <section class="py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="glass-card p-6 scroll-reveal">
                    <h3 class="text-lg font-semibold text-white mb-6">行业分布对比</h3>
                    <div id="industry-comparison-chart" class="chart-container"></div>
                </div>
                
                <div class="glass-card p-6 scroll-reveal">
                    <h3 class="text-lg font-semibold text-white mb-6">重仓股对比</h3>
                    <div class="space-y-4" id="holdings-comparison">
                        <!-- 重仓股对比将通过JavaScript动态生成 -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 基金搜索模态框 -->
    <div id="fund-search-modal" class="fund-search-modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-semibold text-white">选择基金</h3>
                <button onclick="closeFundSearch()" class="text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            
            <div class="mb-4">
                <input type="text" id="modal-fund-search" placeholder="搜索基金名称或代码..." class="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-white placeholder-gray-400 focus:ring-2 focus:ring-yellow-500 focus:border-transparent">
            </div>
            
            <div id="modal-fund-list" class="space-y-2 max-h-96 overflow-y-auto">
                <!-- 基金列表将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-gray-900 border-t border-gray-700 py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center">
                <p class="text-gray-400">&copy; 2024 基金产品画像系统. 专业投资分析平台.</p>
            </div>
        </div>
    </footer>

    <script src="compare.js"></script>
</body>
</html>
